name: Sync Mermaid Docs

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v6

      - name: Checkout mermaid docs
        uses: actions/checkout@v6
        with:
          repository: mermaid-js/mermaid
          path: plugins/mermaid-diagrams/mermaid-source
          sparse-checkout: |
            /docs/syntax
            /docs/config
            /packages/mermaid/src/docs/.vitepress/config.ts
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: latest
          enable-cache: true

      - name: Sync docs from the upstream snapshot
        run: uv run python -m plugin_maintenance.generators.mermaid_diagrams.sync mermaid-source

      - name: Cleanup mermaid source checkout
        run: rm -rf plugins/mermaid-diagrams/mermaid-source

      - name: Run the full build
        run: uv run python -m plugin_maintenance.build

      - name: Open a pull request with the combined changes
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "docs: sync mermaid syntax and config docs"
          title: "docs: sync mermaid syntax and config docs"
          body: >-
            Automated weekly Mermaid docs sync: upstream snapshot refresh plus
            the full build re-render of both `dist/` trees.
          branch: bot/sync-mermaid-docs
          delete-branch: true
