name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      # mise.toml pins uv and every linter binary; uv reads Python from .python-version
      - name: Install toolchain
        uses: jdx/mise-action@v5.0.1
        with:
          github_token: ${{ github.token }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run the full build
        run: uv run python -m plugin_maintenance.build

      - name: Check the committed tree is current
        run: |
          git add -A
          git diff --cached --exit-code

      - name: Validate marketplace manifests
        run: jq empty .agents/plugins/marketplace.json .claude-plugin/marketplace.json

      - name: Validate plugin manifests
        run: find plugins dist -path '*/plugin.json' -print0 | xargs -0 jq empty

      - name: Check whitespace errors
        if: github.event_name == 'pull_request'
        run: git diff --check ${{ github.event.pull_request.base.sha }} HEAD

      - name: Lint
        run: mise run lint

      - name: Run tests
        run: uv run pytest tests

      # Final check on the rendered artifact users install. Local lint
      # (mise lint, prek) excludes dist/ because it is a byte-identical render
      # of plugins/ and would double every finding; the steps above prove dist/
      # is current, so it is linted once, here.
      - name: Lint the rendered dist/ tree
        run: mise run lint-dist
