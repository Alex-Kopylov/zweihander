[project]
name = "zweihander"
version = "0.1.0"
description = "Personal plugin marketplace for AI agents."
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "jinja2>=3.1",
    "pathspec>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "tiktoken>=0.14.0",
    "ruff",
    "ty",
    "flake8",
    "flake8-pydantic",
    "flake8-async",
    "vulture",
    "deptry>=0.25.1",
    "pytest-cov>=7.1.0",
    "prek",
    "yamllint",
    "check-jsonschema",
    "mutmut",
]

[tool.ty.environment]
python-version = "3.14"

[tool.coverage.run]
source = ["plugin_maintenance"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 90

[tool.deptry]
# plugins/ and dist/ ship example code for users; only the build tooling is this project's code
extend_exclude = ["plugins", "dist"]

[tool.typos.files]
# dist/ is rendered from plugins/; the mermaid references are synced verbatim from upstream
extend-exclude = ["dist/", "plugins/mermaid-diagrams/skills/mermaid/references/"]

[tool.mutmut]
paths_to_mutate = ["plugin_maintenance/"]
