[project]
name = "zweihander"
version = "0.1.0"
description = "Simple, robust, and versatile marketplace for agent plugins, forged for the chaos of the AI world."
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
  "jinja2>=3.1",
  "pathspec>=0.12",
]

[dependency-groups]
dev = [
  # pytest.ini sets strict_markers, an ini key pytest 8 ignores.
  "pytest>=9",
  "tiktoken",
  "ruff",
  "ty",
  "flake8",
  "flake8-pydantic",
  "flake8-async",
  "vulture",
  "deptry",
  "pytest-cov",
  "prek",
  "yamllint",
  "check-jsonschema",
  "mutmut",
]

[tool.uv]
# Never fall back to a system interpreter; see
# Alex-Kopylov/ai-ready-modern-python-template#34.
python-preference = "only-managed"

[tool.coverage.run]
source = ["plugin_maintenance"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 90

[tool.deptry]
# plugins/ and dist/ ship example code for users; only the build tooling is this project's code
extend_exclude = ["plugins", "dist"]

[tool.typos.files]
# dist/ is rendered from plugins/; the mermaid references are synced verbatim from upstream
extend-exclude = ["dist/", "plugins/mermaid-diagrams/skills/mermaid/references/"]

[tool.mutmut]
paths_to_mutate = ["plugin_maintenance/"]
