[project]
name = "zweihander"
version = "0.1.0"
description = "Simple, robust, and versatile marketplace for agent plugins, forged for the chaos of the AI world."
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
  "jinja2>=3.1",
  "pathspec>=0.12",
]

[dependency-groups]
dev = [
  # pytest.ini sets strict_markers, an ini key pytest 8 ignores.
  "pytest>=9",
  "ruff",
  "ty",
  "flake8",
  "flake8-pydantic",
  "flake8-async",
  "vulture",
  "deptry",
  "pytest-cov",
  "prek",
  "yamllint",
  "check-jsonschema",
  "mutmut",
]
# Third-party imports of the Python that ships inside plugins/: skill scripts
# and the example code skills tell users to copy. The plugins are developed
# here, so linting (deptry, ty) and running them needs these installed.
plugins = [
  "celery",
  "fakeredis",
  "redis",
  "requests",
  "testcontainers[redis]",
  "tiktoken",
  "youtube-transcript-api",
]

[tool.uv]
# Never fall back to a system interpreter; see
# Alex-Kopylov/ai-ready-modern-python-template#34.
python-preference = "only-managed"
# `uv sync` installs the plugin dependencies too, so deptry and ty resolve them.
default-groups = ["dev", "plugins"]

[tool.coverage.run]
source = ["plugin_maintenance"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 90

[tool.deptry]
# dist/ is build output rendered from plugins/
extend_exclude = ["dist"]
# `app` and `myapp` are the user's own application package in the example code
# skills tell users to copy (`from app.cache import CacheService`). They are
# first-party from the example's point of view, not packages to declare here.
known_first_party = ["app", "myapp"]
# DEP004 assumes scanned code ships as a package whose runtime needs only
# [project].dependencies. This repository builds no distribution (there is no
# [build-system]): plugin_maintenance runs from this checkout and plugin code
# runs in a user's own environment, so every declared group is equally real and
# `uv sync` installs them all by default. Missing (DEP001), unused (DEP002) and
# transitive (DEP003) imports stay checked.
ignore = ["DEP004"]

[[tool.ty.overrides]]
# `app` and `myapp` are the user's own application package in the example code
# skills tell users to copy; see known_first_party under [tool.deptry].
include = ["plugins/**/examples/**", "dist/**/examples/**"]

[tool.ty.overrides.analysis]
allowed-unresolved-imports = ["app.**", "myapp.**"]

[tool.typos.files]
# dist/ is a byte-identical render of plugins/; dist/ is linted once, in CI -
# see the lint-dist step in .github/workflows/ci.yml. The mermaid references are
# synced verbatim from upstream, in plugins/ and in their dist/ copies.
extend-exclude = ["dist/", "**/mermaid-diagrams/skills/mermaid/references/"]

[tool.mutmut]
paths_to_mutate = ["plugin_maintenance/"]
